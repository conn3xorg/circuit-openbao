name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Left uninitialised, OpenBao answers its health check with 501.
      - name: Check OpenBao is up and uninitialised
        run: |
          [ "$(podman exec circuit-openbao curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8200/v1/sys/health)" = 501 ]
      - name: Initialise, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_initialize: "true"
        run: |
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Unseals with the key from the init file, writes and reads a secret
      # with the root token, then restarts: OpenBao must come back sealed,
      # and unseal again with the secret still there.
      - name: Unseal, store a secret, restart and unseal again
        run: |
          podman exec -i circuit-openbao bash -eu <<'EOF'
          export BAO_ADDR=http://127.0.0.1:8200
          f=/root/openbao-init.json
          [ "$(stat -c %a $f)" = 600 ]
          key=$(tr -d '\n ' < $f | sed 's/.*"unseal_keys_b64":\["\([^"]*\)".*/\1/')
          export BAO_TOKEN=$(tr -d '\n ' < $f | sed 's/.*"root_token":"\([^"]*\)".*/\1/')
          health() { curl -s -o /dev/null -w '%{http_code}' $BAO_ADDR/v1/sys/health; }
          active() { for _ in $(seq 30); do [ "$(health)" = 200 ] && return 0; sleep 1; done; return 1; }
          [ "$(health)" = 503 ]
          bao operator unseal "$key" >/dev/null
          active
          bao secrets enable -path=secret kv-v2
          bao kv put secret/hello greeting=world >/dev/null
          [ "$(bao kv get -field=greeting secret/hello)" = world ]
          systemctl restart openbao
          for _ in $(seq 30); do [ "$(health)" = 503 ] && break; sleep 1; done
          [ "$(health)" = 503 ]
          bao operator unseal "$key" >/dev/null
          active
          [ "$(bao kv get -field=greeting secret/hello)" = world ]
          EOF
      - name: Plan again after the restart
        working-directory: examples/local
        env:
          TF_VAR_initialize: "true"
        run: conn3x plan -detailed-exitcode
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
